# The lens of language: the lenses themselves, as rows. Every other lens looks at what places keep; this
# one looks at the lenses in view - those built into ocoeco and those places bring - so that the language
# which makes everything else intelligible is intelligible to itself. Its tables are kept by no place:
# ocoeco fills them from the lenses as they are (src/lenses.rs, as_rows), and a test holds the two equal.
# Each thing of the language has an id - work/backlog/status is a field, work/3 a part - so it can be
# pointed at like any row. It shows; whoever sees merges - nothing here changes a lens.
[lens]
id = "language"
says = "What the lenses themselves say, as rows - the language looking at itself: what is declared again and again, what is asked more than once, what nothing brings into focus."
reads = ["vocabulary"]

[tables.lenses]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "says", type = "string", required = true },
    { name = "grew_from", type = "string" },
    { name = "reads", type = "string" },
]

[tables.lens_tables]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "lens", type = "string", required = true },
    { name = "name", type = "string", required = true },
    { name = "key", type = "string" },
    { name = "extra_fields", type = "boolean" },
    { name = "dated", type = "string" },
]

[tables.lens_fields]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "lens", type = "string", required = true },
    { name = "of_table", type = "string", required = true },
    { name = "name", type = "string", required = true },
    { name = "kind", type = "string" },
    { name = "needed", type = "boolean" },
    { name = "allowed", type = "string" },
    { name = "at", type = "integer" },
    { name = "pattern", type = "string" },
]

[tables.lens_entries]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "lens", type = "string", required = true },
    { name = "entry", type = "string", required = true },
    { name = "fills", type = "string", required = true },
    { name = "asks", type = "string" },
    { name = "says", type = "string" },
    { name = "supplies", type = "string" },
]

[tables.lens_relations]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "lens", type = "string", required = true },
    { name = "from", type = "string", required = true },
    { name = "to", type = "string", required = true },
    { name = "passes_over", type = "string" },
    { name = "level", type = "string" },
]

[tables.lens_parts]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "lens", type = "string", required = true },
    { name = "part", type = "integer", required = true },
    { name = "title", type = "string" },
    { name = "always", type = "boolean" },
    { name = "query", type = "string" },
    { name = "lays_out", type = "string" },
    { name = "places", type = "string" },
    { name = "only", type = "string" },
    { name = "measure", type = "string" },
    { name = "of", type = "string" },
    { name = "whole", type = "string" },
    { name = "chain", type = "string" },
    { name = "per", type = "string" },
    { name = "named", type = "string" },
    { name = "urgent", type = "boolean" },
]

# The glimpse of the lens of language: a lens is entered like anything else. A lens says what it is and
# what it reads; a part says what it asks and how a line is laid out - or which lens it places, and under
# which heading. A lens a place keeps this way is looked through like any other.
[[glimpse]]
entry = "lens"
says = "A lens, kept as rows: what it says of itself, and the tables of other lenses it reads."
table = "lenses"
asks = ["says", "reads", "grew_from"]

[[glimpse]]
entry = "part"
says = "A part of a lens: what it asks and how a line is laid out - or which lens it places, and under which heading."
table = "lens_parts"
asks = ["lens", "part", "title", "named", "urgent", "query", "lays_out", "places", "only", "measure", "whole", "chain", "per"]

[[glimpse]]
entry = "table"
says = "A table a lens defines, kept as rows: its key, whether a row may carry more than is declared, and what dates it."
table = "lens_tables"
asks = ["lens", "name", "key", "extra_fields", "dated"]

[[glimpse]]
entry = "field"
says = "A field of a table a lens defines: its place in order, its kind, whether it is needed, the values it allows, and the shape a value must have."
table = "lens_fields"
asks = ["lens", "of_table", "name", "at", "kind", "needed", "allowed", "pattern"]

[[glimpse]]
entry = "entry"
says = "An entry a lens takes: the table it fills, what it asks, and what the computer supplies (field from when; ...)."
table = "lens_entries"
asks = ["lens", "entry", "says", "fills", "asks", "supplies"]

[[glimpse]]
entry = "relation"
says = "A relation a lens declares: the field whose values are links, the tables they point into, and what is passed over."
table = "lens_relations"
asks = ["lens", "from", "to", "passes_over", "level"]

[[focus]]
title = "a field declared again and again ({count})"
sql = """
SELECT name, count(*) AS times, string_agg(DISTINCT of_table, ', ' ORDER BY of_table) AS tables
FROM lens_fields GROUP BY name HAVING count(*) > 2 ORDER BY times DESC, name
"""
line = "{name} - declared in {times} tables: {tables}"

[[focus]]
title = "the same line of a query, written more than once ({count})"
sql = """
WITH written AS (
  SELECT p.lens, trim(t.words) AS words FROM lens_parts p, unnest(string_split(p.query, chr(10))) AS t(words)
)
SELECT words, count(*) AS times, string_agg(DISTINCT lens, ', ' ORDER BY lens) AS lenses
FROM written WHERE length(words) > 60 GROUP BY words HAVING count(*) > 1 ORDER BY times DESC, words LIMIT 12
"""
line = "{times} times, in {lenses}: {words}"

[[focus]]
title = "a table nothing brings into focus ({count})"
sql = """
SELECT t.name, t.lens FROM lens_tables t
WHERE NOT EXISTS (
  SELECT 1 FROM lens_parts p WHERE regexp_matches(p.query, '(^|[^a-z_])' || t.name || '([^a-z_]|$)'))
ORDER BY t.lens, t.name
"""
line = "{name} - defined by {lens}"

# The two faces of a lens are put and get: what its entry puts, its focus should be able to show. A lens
# whose entry fills a table none of its own parts asks of puts what it does not itself bring into focus.
[[focus]]
title = "what a lens puts and does not itself get ({count})"
sql = """
SELECT e.lens, e.entry, e.fills FROM lens_entries e
WHERE NOT EXISTS (
  SELECT 1 FROM lens_parts p WHERE p.lens = e.lens AND regexp_matches(p.query, '(^|[^a-z_])' || e.fills || '([^a-z_]|$)'))
ORDER BY e.lens, e.entry
"""
line = "{lens}: its entry {entry} puts into {fills}, and none of its parts asks of {fills}"

# The names of the language are words. A lens says what it is; a table and a field are named and say
# nothing - unless the vocabulary gives the word a meaning. This part shows which names have one.
[[focus]]
title = "the names of the language, and which have a meaning said ({count})"
sql = """
WITH names AS (
  SELECT DISTINCT name, 'a field' AS what FROM lens_fields
  UNION SELECT DISTINCT name, 'a table' FROM lens_tables
  UNION SELECT DISTINCT id, 'a lens' FROM lenses
), said AS (SELECT DISTINCT lower(term) AS term FROM vocabulary)
SELECT what, count(*) AS names,
       count(*) FILTER (WHERE name IN (SELECT term FROM said)) AS with_meaning,
       coalesce(string_agg(name, ', ' ORDER BY name) FILTER (WHERE name IN (SELECT term FROM said)), 'none') AS which
FROM names GROUP BY what ORDER BY what
"""
line = "{what}: {names} names, {with_meaning} given a meaning as a word - {which}"

[[focus]]
title = "a part placed from another lens ({count})"
sql = """
SELECT lens, places, CASE WHEN coalesce("only", '') <> '' THEN ' - only ' || "only" ELSE ' - all of it' END AS which
FROM lens_parts WHERE coalesce(places, '') <> '' ORDER BY lens, part
"""
line = "{lens} places what {places} brings into focus{which}"

[[focus]]
title = "a lens that takes nothing, or brings nothing into focus ({count})"
sql = """
SELECT l.id,
       CASE WHEN NOT EXISTS (SELECT 1 FROM lens_parts p WHERE p.lens = l.id) THEN 'brings nothing into focus'
            ELSE 'takes no entry' END AS lacks
FROM lenses l
WHERE NOT EXISTS (SELECT 1 FROM lens_parts p WHERE p.lens = l.id)
   OR NOT EXISTS (SELECT 1 FROM lens_entries e WHERE e.lens = l.id)
ORDER BY 2, l.id
"""
line = "{id} - {lacks}"

[[focus]]
always = true
sql = """
SELECT (SELECT count(*) FROM lenses) AS lenses, (SELECT count(*) FROM lens_tables) AS tables,
       (SELECT count(*) FROM lens_fields) AS fields, (SELECT count(*) FROM lens_entries) AS entries,
       (SELECT count(*) FROM lens_parts) AS parts
"""
line = "{lenses} lenses in view: {tables} tables, {fields} fields, {entries} entries, {parts} parts in focus"
