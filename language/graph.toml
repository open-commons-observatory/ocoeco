# The lens of the graph: every row of every place in view as a thing, and every link between them as an
# edge - this, how, that. A link a row holds is named by its field (serves, refines, advances); a
# connection is named by how it bears, through the connection that says so. No place keeps these tables:
# ocoeco fills them from the links the places hold (src/relations.rs, as_graph). It asks what rows alone
# could not: what points at a thing, what nothing points at, and how far a line of one kind runs.
[lens]
id = "graph"
says = "Every link between everything in view, as one relation - this, how, that: what is pointed at most, what nothing points at, how far a line of one kind runs; and, for other lenses to ask of, what points nowhere."

[tables.things]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "of_table", type = "string", required = true },
    { name = "place", type = "string", required = true },
    { name = "says", type = "string" },
]

[tables.edges]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "from", type = "string", required = true },
    { name = "how", type = "string", required = true },
    { name = "to", type = "string", required = true },
    { name = "holds", type = "boolean" },
    { name = "via", type = "string" },
    { name = "from_place", type = "string" },
    { name = "from_star", type = "string" },
    { name = "from_table", type = "string" },
    { name = "from_id", type = "string" },
    { name = "to_place", type = "string" },
    { name = "to_star", type = "string" },
    { name = "to_table", type = "string" },
    { name = "to_id", type = "string" },
    { name = "via_star", type = "string" },
    { name = "via_id", type = "string" },
    { name = "written", type = "string" },
    { name = "from_written", type = "string" },
    { name = "from_holds", type = "boolean" },
    { name = "level", type = "string" },
    { name = "nature", type = "string" },
]

[[focus]]
title = "pointed at most ({count})"
sql = """
SELECT regexp_replace("to", '^[^/]+/', '') AS shown, count(*) AS times, string_agg(DISTINCT how, ', ' ORDER BY how) AS hows
FROM edges WHERE holds GROUP BY "to" ORDER BY times DESC, "to" LIMIT 12
"""
line = "{shown} - pointed at {times} time(s): {hows}"

# What is pointed at by a link that holds: one shape, named, that the parts below ask of.
[[focus]]
named = "pointed"
sql = """
SELECT DISTINCT "to" AS id FROM edges WHERE holds
"""

[[focus]]
title = "what nothing points at, by kind ({count})"
sql = """
SELECT t.of_table, count(*) AS kept, count(*) FILTER (WHERE p.id IS NULL) AS alone
FROM things t LEFT JOIN pointed p ON p.id = t.id
GROUP BY t.of_table ORDER BY alone DESC, t.of_table
"""
line = "{of_table} - {alone} of {kept} have nothing pointing at them"
measure = "alone"
whole = "kept"

[[focus]]
title = "how things point, by the nature of the pointing ({count})"
sql = """
SELECT nature, count(*) AS links,
       CASE WHEN count(DISTINCT how) > 1 OR min(how) <> nature
            THEN ', said in ' || count(DISTINCT how) || ' word(s): ' || string_agg(DISTINCT how, ', ' ORDER BY how) ELSE '' END AS said
FROM edges GROUP BY nature ORDER BY links DESC, nature
"""
line = "{nature} - {links} links{said}"

[[focus]]
title = "the longest line of one kind ({count})"
sql = """
WITH RECURSIVE walk(start, reached, how, depth) AS (
  SELECT "from", "to", how, 1 FROM edges WHERE holds AND how <> 'repeats'
  UNION ALL
  SELECT w.start, e."to", w.how, w.depth + 1
  FROM walk w JOIN edges e ON e."from" = w.reached AND e.how = w.how AND e.holds
  WHERE w.depth < 16
)
SELECT how, max(depth) AS depth, regexp_replace(arg_max(start, depth), '^[^/]+/', '') AS began,
       regexp_replace(arg_max(reached, depth), '^[^/]+/', '') AS ended
FROM walk GROUP BY how HAVING max(depth) > 1 ORDER BY depth DESC, how
"""
line = "{how} - {depth} links long, from {began} to {ended}"

# A repeat is not a direction: it says two things are one nature with different faces. Walked as a line
# it comes back to where it began; asked as what it is, it is a group - every thing reached through
# repeats, whichever way, is one of its faces.
[[focus]]
title = "one nature, many faces - what repeats joins ({count})"
sql = """
WITH RECURSIVE pairs AS (
  SELECT "from" AS a, "to" AS b FROM edges WHERE how = 'repeats' AND holds
  UNION SELECT "to", "from" FROM edges WHERE how = 'repeats' AND holds
), reach(start, reached) AS (
  SELECT a, a FROM pairs
  UNION
  SELECT r.start, p.b FROM reach r JOIN pairs p ON p.a = r.reached
), one AS (SELECT start, min(reached) AS nature FROM reach GROUP BY start)
SELECT count(*) AS faces, string_agg(regexp_replace(start, '^[^/]+/', ''), ', ' ORDER BY start) AS which
FROM one GROUP BY nature ORDER BY faces DESC, nature
"""
line = "{faces} faces of one: {which}"

[[focus]]
# What points nowhere is a shape this lens names and does not lay out: whether something fits is the lens
# of signs' to say, and it asks of this shape - one place, read by whoever needs it.
named = "nowhere"
sql = """
SELECT "from", how, "to", from_star, from_table, from_id, to_star, to_table, to_id FROM edges
WHERE holds = false OR from_holds = false
"""

# How far toward a purpose the work can be walked: from a record of work to the item it advances, and on
# to what that item serves or a milestone that rests on it. Where the count falls, a relation was not drawn.
[[focus]]
always = true
sql = """
WITH advanced AS (SELECT DISTINCT "from" AS record, "to" AS item FROM edges
                  WHERE how = 'advances' AND from_table = 'glimpses' AND to_table = 'backlog' AND holds),
     serving AS (SELECT DISTINCT "from" AS item FROM edges WHERE how = 'serves' AND from_table = 'backlog' AND holds),
     rested AS (SELECT DISTINCT "to" AS item FROM edges WHERE how = 'criteria' AND to_table = 'backlog' AND holds)
SELECT (SELECT count(*) FROM things WHERE of_table = 'glimpses') AS records,
       (SELECT count(DISTINCT record) FROM advanced) AS to_item,
       (SELECT count(DISTINCT a.record) FROM advanced a JOIN serving s ON s.item = a.item) AS to_what_it_serves,
       (SELECT count(DISTINCT a.record) FROM advanced a JOIN rested r ON r.item = a.item) AS to_a_milestone
"""
line = "walking up: of {records} records of work, {to_item} reach an item; {to_what_it_serves} reach what that item serves; {to_a_milestone} reach a milestone that rests on it"

[[focus]]
always = true
sql = """
SELECT (SELECT count(*) FROM things) AS things, (SELECT count(*) FROM edges) AS edges,
       (SELECT count(*) FROM things t WHERE t.id NOT IN (SELECT id FROM pointed)) AS alone,
       (SELECT count(*) FROM edges WHERE holds IS NULL) AS unseen
"""
line = "{things} things in view, {edges} links between them; {alone} things nothing points at; {unseen} links point where this place cannot see"
