# The lens of around: looked through from one thing. Every other lens looks across a kind of thing; this
# one stands on a thing - ocoeco focus around@ecosystem/backlog:the-simplest-lens - and shows what it
# points at and what points at it, each by how, with a few words of what each is. To step is to stand on a
# neighbour: the same lens, from there. So one walks - toward what a thing is for, toward what it rests on,
# and back - without the relations being lost on the way. The thing is named as the graph names it: where
# it is held, its table, its id - the place in full, or by its star.
[lens]
id = "around"
says = "From one thing: what it points at and what points at it, each by how - a step away in every direction. Looked through from a thing: around@star/table:id."
reads = ["edges", "things"]

# Where one stands: the thing of that name. One shape, named, that the parts below ask of.
[[focus]]
named = "here"
sql = """
SELECT id, star, of_table, says, star || '/' || of_table || ':' || substr(id, length(place) + length(of_table) + 3) AS thing
FROM things
WHERE id = '{here}' OR star || '/' || of_table || ':' || substr(id, length(place) + length(of_table) + 3) = '{here}'
"""

[[focus]]
title = "standing on ({count})"
sql = """
SELECT thing, says FROM here ORDER BY thing
"""
line = "{thing} - {says}"

[[focus]]
title = "from here - what it points at ({count})"
sql = """
SELECT e.how, e.to_star || '/' || e.to_table || ':' || e.to_id AS thing, coalesce(t.says, '') AS says,
       CASE WHEN e.holds THEN '' WHEN e.holds IS NULL THEN ' (not in view from here)' ELSE ' (points nowhere)' END AS held
FROM edges e JOIN here h ON e."from" = h.id LEFT JOIN things t ON t.id = e."to"
ORDER BY e.how, thing
"""
line = "{how} - {thing}{held} - {says}"

[[focus]]
title = "to here - what points at it ({count})"
sql = """
SELECT e.how, e.from_star || '/' || e.from_table || ':' || e.from_id AS thing, coalesce(t.says, '') AS says
FROM edges e JOIN here h ON e."to" = h.id LEFT JOIN things t ON t.id = e."from"
ORDER BY e.how, thing
"""
line = "{thing} - {how} - {says}"

[[focus]]
always = true
sql = """
SELECT CASE WHEN (SELECT count(*) FROM here) = 0
            THEN 'stand on a thing to look around: ocoeco focus around@star/table:id'
            ELSE (SELECT count(*) FROM edges e JOIN here h ON e."from" = h.id) || ' ways from here, ' ||
                 (SELECT count(*) FROM edges e JOIN here h ON e."to" = h.id) || ' ways to here' END AS said
"""
line = "{said}"
