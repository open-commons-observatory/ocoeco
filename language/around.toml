# The lens of around: looked through from one thing. Every other lens looks across a kind of thing; this
# one stands on a thing - ocoeco focus around@ecosystem/backlog:the-simplest-lens - and shows what it
# points at and what points at it, each by the nature of the pointing - what it rests on, what it is for,
# what it follows, what it is about - with a few words of what each is. To step is to stand on a
# neighbour: the same lens, from there. So one walks - toward what a thing is for, toward what it rests on,
# and back - without the relations being lost on the way. The thing is named as the graph names it: where
# it is held, its table, its id - the place in full, or by its star.
[lens]
id = "around"
says = "From one thing: where it is held, what it points at and what points at it, each by how - a step away in every direction; from a place, what it holds and reaches for. Looked through from a thing: around@star/table:id."
reads = ["edges", "things"]

# Where one stands: the thing of that name. One shape, named, that the parts below ask of.
[[focus]]
named = "here"
sql = """
SELECT id, star, of_table, place, says, star || '/' || of_table || ':' || substr(id, length(place) + length(of_table) + 3) AS thing
FROM things
WHERE id = '{here}' OR star || '/' || of_table || ':' || substr(id, length(place) + length(of_table) + 3) = '{here}'
"""

[[focus]]
title = "standing on ({count})"
sql = """
SELECT thing, says FROM here ORDER BY thing
"""
line = "{thing} - {says}"

# Every thing is held in a place, and a place says what it is for: one step up from anything.
[[focus]]
title = "held in ({count})"
sql = """
SELECT p.star || '/places:' || p.star AS thing, p.says
FROM here h JOIN things p ON p.of_table = 'places' AND p.place = h.place WHERE h.of_table <> 'places'
"""
line = "{thing} - {says}"

# Standing on a place: what it holds, by kind - a step down into any of them is that table, looked through
# as itself - and the milestones it holds, which say what it reaches for.
[[focus]]
title = "holds, by kind ({count})"
sql = """
SELECT t.of_table, count(*) AS things FROM here h JOIN things t ON t.place = h.place AND t.of_table <> 'places'
WHERE h.of_table = 'places' GROUP BY t.of_table ORDER BY things DESC, t.of_table
"""
line = "{of_table} - {things}"

[[focus]]
title = "reaches for ({count})"
sql = """
SELECT t.star || '/milestones:' || substr(t.id, length(t.place) + 13) AS thing, t.says
FROM here h JOIN things t ON t.place = h.place AND t.of_table = 'milestones'
WHERE h.of_table = 'places' ORDER BY t.id LIMIT 24
"""
line = "{thing} - {says}"

# And why it exists, in its own words: the rows of its idea - the fuller saying of what its mark says in
# a line.
[[focus]]
title = "why it exists, in its own words ({count})"
sql = """
SELECT t.star || '/idea:' || substr(t.id, length(t.place) + 7) AS thing, t.says
FROM here h JOIN things t ON t.place = h.place AND t.of_table = 'idea'
WHERE h.of_table = 'places' ORDER BY t.id LIMIT 12
"""
line = "{thing} - {says}"

# A pointing as it is said: by what it is - and, where its field goes by another name, that name beside it.
# One shape, named, that the two parts below ask of: what is said one way is said once.
[[focus]]
named = "said"
sql = """
SELECT e.*, CASE WHEN e.nature <> e.how THEN ' (' || e.how || ')' ELSE '' END AS said_as FROM edges e
"""

[[focus]]
title = "from here - what it points at ({count})"
sql = """
SELECT e.nature, e.said_as,
       e.to_star || '/' || e.to_table || ':' || e.to_id AS thing, coalesce(t.says, '') AS says,
       CASE WHEN e.holds THEN '' WHEN e.holds IS NULL THEN ' (not in view from here)' ELSE ' (points nowhere)' END AS held
FROM said e JOIN here h ON e."from" = h.id LEFT JOIN things t ON t.id = e."to"
ORDER BY e.nature, e.how, thing
"""
line = "this {nature} {thing}{said_as}{held} - {says}"

[[focus]]
title = "to here - what points at it ({count})"
sql = """
SELECT e.nature, e.said_as,
       e.from_star || '/' || e.from_table || ':' || e.from_id AS thing, coalesce(t.says, '') AS says
FROM said e JOIN here h ON e."to" = h.id LEFT JOIN things t ON t.id = e."from"
ORDER BY e.nature, e.how, thing
"""
line = "{thing} {nature} this{said_as} - {says}"

# and in time: what came just before it and just after, in the same place - a step along the flow, as the
# parts above are steps along what points at what
[[focus]]
title = "in time - what came just before and after it, in the same place ({count})"
sql = """
WITH flow AS (
  SELECT t.id, t.star, t.of_table, t.place, t.says, t."at",
         row_number() OVER (PARTITION BY t.place ORDER BY t."at", t.id) AS nth
  FROM things t WHERE t."at" IS NOT NULL
), me AS (
  SELECT f.place, f.nth FROM flow f JOIN here h ON f.id = h.id
)
SELECT CASE WHEN f.nth < me.nth THEN 'before' ELSE 'after' END AS side,
       f.star || '/' || f.of_table || ':' || substr(f.id, length(f.place) + length(f.of_table) + 3) AS thing,
       replace(left(f."at", 16), 'T', ' ') AS at_when, coalesce(f.says, '') AS says
FROM flow f JOIN me ON f.place = me.place AND f.nth BETWEEN me.nth - 2 AND me.nth + 2 AND f.nth <> me.nth
ORDER BY f.nth
"""
line = "{side}: {at_when} {thing} - {says}"

[[focus]]
always = true
sql = """
SELECT CASE WHEN (SELECT count(*) FROM here) = 0
            THEN 'stand on a thing to look around: ocoeco focus around@star/table:id'
            ELSE (SELECT count(*) FROM edges e JOIN here h ON e."from" = h.id) || ' ways from here, ' ||
                 (SELECT count(*) FROM edges e JOIN here h ON e."to" = h.id) || ' ways to here' END AS said
"""
line = "{said}"
