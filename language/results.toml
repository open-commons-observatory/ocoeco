# The lens of results.
[lens]
id = "results"
says = "What the work produced: glimpses of work as it was done, how things work and the evidence, what was done by hand - and what was changed, as git has it."

[tables.glimpses]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "at", type = "string", required = true },
    { name = "by", type = "string" },
    { name = "kind", type = "string", required = true, enum = ["feat", "fix", "docs", "refactor", "perf", "test", "build", "ci", "chore", "style", "revert"] },
    { name = "summary", type = "string", required = true },
    { name = "breaking", type = "string" },
    { name = "advances", type = "string" },
    { name = "touches", type = "string" },
    { name = "minutes", type = "number" },
    { name = "load", type = "number" },
    { name = "released", type = "string" },
    { name = "where", type = "string" },
]

[tables.workings]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "what", type = "string", required = true },
    { name = "kind", type = "string", required = true, enum = ["tool", "check", "gatherer", "test", "practice"] },
    { name = "serves", type = "string", required = true },
    { name = "how", type = "string", required = true },
    { name = "why", type = "string" },
    { name = "evidence", type = "string" },
    { name = "uses", type = "string" },
]

[tables.manual_work]
key = ["id"]
extra_fields = true
dated = "first"
fields = [
    { name = "id", type = "string", required = true },
    { name = "action", type = "string", required = true },
    { name = "count", type = "integer", required = true },
    { name = "first", type = "string" },
    { name = "last", type = "string" },
    { name = "status", type = "string", required = true, enum = ["manual", "automated"] },
    { name = "automated_by", type = "string" },
    { name = "minutes", type = "number" },
]
tells = "action"

[tables.manual_events]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "record", type = "string", required = true },
    { name = "at", type = "string", required = true },
    { name = "minutes", type = "number" },
    { name = "load", type = "number" },
    { name = "effort", type = "number" },
    { name = "change", type = "string" },
]
tells = "{record}, {minutes} minute(s) by hand"

# What was changed, as git has it: each change to a place's repository - its name, when, by whom, and
# what it says of itself. Not kept by a place: read from the history of the repository where the place is
# held, when it is asked for (the route below).
[tables.commits]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "at", type = "string" },
    { name = "by", type = "string" },
    { name = "says", type = "string" },
    { name = "record", type = "string" },
]

# a change made through ocoeco is part of the record of work it says the same as: so one walks from why
# something was decided, to the work, to what changed - and on to the code
[[relation]]
from = "commits.record"
to = ["glimpses"]
nature = "is part of"

[[relation]]
from = "glimpses.advances"
to = ["*"]
nature = "is for"
of_what_was = true

[[relation]]
from = "glimpses.touches"
to = ["*"]
nature = "is about"
of_what_was = true

# Where a record of work was made: the things stood on while it was done - supplied by the act of looking
# through a lens from a thing, never typed. The work is seen where it happens.
[[relation]]
from = "glimpses.where"
to = ["*"]
nature = "is about"
of_what_was = true

# each time it was done by hand is one more time of that work done by hand
[[relation]]
from = "manual_events.record"
to = ["manual_work"]
nature = "repeats"

[[relation]]
from = "workings.serves"
to = ["milestones", "backlog"]
nature = "is for"

# The glimpse of the lens of results. The record of work as it is done has its own way in -
# ocoeco glimpse "what was done" - and work done by hand is recorded by ocoeco manual.
# A route: the rows of commits are read from a surface - the history of each place's own repository -
# where the place is held. Nothing is stored; the beam says where they were read and when.
[[route]]
table = "commits"
from = "git history"

[[glimpse]]
entry = "working"
says = "How something works, why, and the evidence that it does."
table = "workings"
asks = ["what", "kind", "serves", "how", "why", "evidence", "uses"]

# The focus of the lens of results: what was done lately, and what is still done by hand.
[[focus]]
title = "done lately, the newest ({count})"
sql = """
SELECT star, left(CAST("at" AS VARCHAR), 10) AS day, summary FROM glimpses ORDER BY "at" DESC, seq DESC LIMIT 15
"""
line = "{day} {star} - {summary}"

[[focus]]
title = "still done by hand ({count})"
sql = """
SELECT star, action, "count" AS times FROM manual_work WHERE status = 'manual'
ORDER BY try_cast("count" AS INTEGER) DESC, star, seq
"""
line = "{star} - {action} ({times} times)"

# each time something was done by hand, and what it took: the handwork, where it was recorded - what took
# the most first, since that is what would be most worth making through the system itself
[[focus]]
title = "by hand, and what it took ({count})"
sql = """
SELECT star, record, star || '/manual_work:' || record AS thing, count(*) AS times,
       CAST(round(sum(coalesce(try_cast(minutes AS DOUBLE), 0))) AS INTEGER) AS minutes, max(left("at", 10)) AS last
FROM manual_events GROUP BY star, record ORDER BY sum(coalesce(try_cast(minutes AS DOUBLE), 0)) DESC, star, record
"""
line = "{star}/{record} - {times} time(s), {minutes} minute(s) in all, the last on {last}"

[[focus]]
always = true
sql = """
SELECT (SELECT count(*) FROM glimpses) AS glimpses, (SELECT count(*) FROM workings) AS workings,
       (SELECT count(*) FROM workings WHERE coalesce(evidence, '') <> '') AS shown,
       (SELECT count(*) FROM manual_work WHERE status = 'automated') AS automated,
       (SELECT count(*) FROM manual_work) AS byhand
"""
line = "{glimpses} glimpses of work; {workings} workings, {shown} with evidence; {automated} of {byhand} things once done by hand are automated"

# What was changed lately, as git has it - beside what the records of work say was done.
[[focus]]
title = "changed lately, as git has it ({count})"
sql = """
SELECT star, replace(left("at", 16), 'T', ' ') AS at_, "by" AS who, left(says, 110) AS says
FROM commits ORDER BY "at" DESC LIMIT 12
"""
line = "{at_} {star} - {says} ({who})"

[[focus]]
always = true
sql = """
SELECT count(*) AS changes, count(DISTINCT star) AS places, coalesce(min(left("at", 10)), '-') AS first, coalesce(max(left("at", 10)), '-') AS last
FROM commits
"""
line = "{changes} changes in {places} place(s), {first} to {last}, as git has them"
