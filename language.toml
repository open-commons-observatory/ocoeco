# ocoeco's shared language: the tables every project may keep, declared as data - a tad declaration
# (creation-guidelines/tad-engine). Each table is a minimum: a project's rows may carry more fields
# (extra_fields). `ocoeco note` checks the row it writes against this with tad's check_row, fills a new
# row's dated field with today, and keeps every other line of the table exactly as it was.

[tables.backlog]
key = ["id"]
extra_fields = true
dated = "opened"
fields = [
    { name = "id", type = "string", required = true },
    { name = "title", type = "string", required = true },
    { name = "status", type = "string", required = true, enum = ["open", "in-progress", "done"] },
    { name = "note", type = "string" },
    { name = "opened", type = "string" },
]

[tables.decisions]
key = ["id"]
extra_fields = true
dated = "date"
fields = [
    { name = "id", type = "string", required = true },
    { name = "date", type = "string", required = true },
    { name = "decision", type = "string", required = true },
    { name = "why", type = "string", required = true },
    { name = "rejected", type = "string" },
    { name = "about", type = "string" },
    { name = "research", type = "string" },
    { name = "sources", type = "string" },
]

