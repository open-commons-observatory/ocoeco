[package]
name = "ocoeco"
version = "0.7.0"
edition = "2021"
description = "The Open Commons Observatory's ecosystem: places that say what they are, and lenses that bring them into focus"
license = "MIT OR Apache-2.0"

[build-dependencies]
toml = "0.8"

[dependencies]
anyhow = "1"
# the reader of a typed line: what an entry may be given is handed to it as records
argenv-resolve = "0.3"
tad = { git = "https://github.com/creation-guidelines/tad-engine", tag = "tad-v0.5.0" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"

# How the released files are packed (packaging/build-packages.sh, called by the package conveyor).
[package.metadata.deb]
maintainer = "open-commons-observatory <agent@creation-guidelines>"
extended-description = "ocoeco reads what places keep as text - their decisions, work, connections - through lenses, and brings it into focus on a surface: a terminal, a page, plain text, or structure for a program. A place says what it is with a mark; a lens says what it brings into focus."
assets = [["target/release/ocoeco", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/ocoeco", dest = "/usr/bin/ocoeco", mode = "755" }]
