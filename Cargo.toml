[package]
name = "ocoeco"
version = "0.1.0"
edition = "2021"
description = "The observatory's information ecosystem: the mark, discovery, the harvest"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
tad = { git = "https://github.com/creation-guidelines/tad-engine", tag = "tad-v0.4.0" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"
