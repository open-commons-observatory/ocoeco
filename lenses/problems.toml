# The lens of problems: the andon. A problem is raised by whoever sees it - what, where, when, by whom -
# and stays in view until its countermeasure is written; writing the countermeasure is what handles it.
# It also reads the work, to see what has stalled or is held by nobody.
[lens]
id = "problems"
says = "What is wrong, seen by anyone and kept in view until a countermeasure is in place; and what has stalled in the work."
reads = ["backlog"]

[tables.problems]
key = ["id"]
extra_fields = true
dated = "seen"
fields = [
    { name = "id", type = "string", required = true },
    { name = "what", type = "string", required = true },
    { name = "seen", type = "string", required = true },
    { name = "by", type = "string", required = true },
    { name = "where", type = "string" },
    { name = "countermeasure", type = "string" },
    { name = "handled", type = "string" },
]

# where a problem was seen, and what its countermeasure is, are links to rows
[[relation]]
from = "problems.where"
to = ["*"]

# The glimpse of the lens of problems.
[[glimpse]]
entry = "problem"
says = "Something wrong, raised by whoever sees it; it stays in view until its countermeasure is written."
table = "problems"
asks = ["what", "where", "countermeasure"]
supplies = [
    { field = "seen", from = "today", when = "new" },
    { field = "by", from = "who", when = "new" },
    { field = "handled", from = "today", when = "countermeasure changes" },
]

# The focus of the lens of problems.
[[focus]]
title = "raised, not yet handled ({count})"
always = true
sql = """
SELECT star, id, what, "by",
       CASE WHEN coalesce("where", '') <> '' THEN ' - at ' || "where" ELSE '' END AS at,
       date_diff('day', try_cast(seen AS DATE), DATE '{today}') AS days
FROM problems WHERE coalesce(handled, '') = '' ORDER BY seen, seq
"""
line = "  {star}/{id} - {what}{at} (seen by {by}, {days} day(s) ago)"

[[focus]]
title = "stalled in the work ({count})"
sql = """
SELECT star, id, title, status, date_diff('day', try_cast(since AS DATE), DATE '{today}') AS days
FROM backlog WHERE status IN ('in-progress', 'waiting')
  AND date_diff('day', try_cast(since AS DATE), DATE '{today}') > 7
ORDER BY days DESC, seq
"""
line = "  {star}/{id} - {title}: {status} for {days} days"

[[focus]]
title = "handled lately ({count})"
sql = """
SELECT star, id, what, countermeasure FROM problems
WHERE coalesce(handled, '') <> '' AND date_diff('day', try_cast(handled AS DATE), DATE '{today}') <= 14
ORDER BY handled DESC, seq
"""
line = "  {star}/{id} - {what} - countermeasure: {countermeasure}"
