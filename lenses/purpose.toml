# The lens of purpose.
[lens]
id = "purpose"
says = "Why a star exists and what it must reach: its idea, and its milestones with what makes each reached."
reads = ["backlog", "edges"]

[tables.idea]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "ord", type = "integer", required = true },
    { name = "kind", type = "string", required = true, enum = ["lead", "problem", "idea", "picture", "limit", "start"] },
    { name = "heading", type = "string" },
    { name = "text", type = "string", required = true },
]

[tables.milestones]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "subject", type = "string", required = true },
    { name = "ord", type = "integer", required = true },
    { name = "title", type = "string", required = true },
    { name = "horizon", type = "string", required = true, enum = ["working", "perfection", "ongoing"] },
    { name = "readiness", type = "integer", required = true },
    { name = "criteria", type = "string" },
    { name = "why", type = "string" },
]

# a milestone is reached when these are done: links to rows (backlog:id), and conditions - something
# at a device or a level, always written with an @ (feature:voice-calls@linux-best,
# component:kernel@xiaomi-surya, tests@xiaomi-surya) - which are not links to a row and are passed over
[[relation]]
from = "milestones.criteria"
to = ["*"]
passes_over = ["@"]

# The glimpse of the lens of purpose.
[[glimpse]]
entry = "milestone"
says = "What must be reached, and what makes it reached."
table = "milestones"
asks = ["title", "subject", "horizon", "readiness", "ord", "criteria", "why"]

[[glimpse]]
entry = "idea"
says = "Why the star exists: one part of its idea."
table = "idea"
asks = ["kind", "heading", "text", "ord"]

# The focus of the lens of purpose: what each star is for, and what is being reached.
[[focus]]
title = "what each star is for ({count})"
sql = """
SELECT star, CASE WHEN length("text") > 190 THEN left("text", 190) || '...' ELSE "text" END AS says
FROM idea WHERE kind = 'lead' ORDER BY star, seq
"""
line = "{star} - {says}"

# A milestone is reached when what it rests on is done - read off the work, never typed. Its criteria
# name items of the backlog (backlog:id), read off the graph's edges; other criteria are conditions told by tests (a feature at a
# level), which this lens does not judge and says so. readiness is not how ready a milestone is: it is
# its rung on the path, earned in order - shown as the rung it is.
[[focus]]
title = "being reached - how much of what each rests on is done ({count})"
sql = """
WITH items AS (
  SELECT e.from_star AS star, e.from_id AS id, count(*) AS items, count(*) FILTER (WHERE b.status = 'done') AS done
  FROM edges e LEFT JOIN backlog b ON b.star = e.to_star AND b.id = e.to_id
  WHERE e.how = 'criteria' AND e.from_table = 'milestones' AND e.to_table = 'backlog'
  GROUP BY 1, 2
)
SELECT m.star, m.title, try_cast(m.readiness AS INTEGER) AS rung, i.done, i.items,
       CASE WHEN length(m.criteria) > length(replace(m.criteria, '@', ''))
            THEN ', and ' || (length(m.criteria) - length(replace(m.criteria, '@', ''))) || ' told by tests' ELSE '' END AS told
FROM milestones m JOIN items i ON i.star = m.star AND i.id = m.id
WHERE m.horizon = 'working' AND i.done < i.items
ORDER BY (i.items - i.done), rung, m.star, m.seq LIMIT 20
"""
line = "{star} - {title} (rung {rung}): {done} of {items} done{told}"
# what the line means: so much of what it rests on is done - a measure whose whole is the line's own
measure = "done"
whole = "items"

[[focus]]
always = true
sql = """
WITH items AS (
  SELECT e.from_star AS star, e.from_id AS id, count(*) AS items, count(*) FILTER (WHERE b.status = 'done') AS done
  FROM edges e LEFT JOIN backlog b ON b.star = e.to_star AND b.id = e.to_id
  WHERE e.how = 'criteria' AND e.from_table = 'milestones' AND e.to_table = 'backlog'
  GROUP BY 1, 2
), each AS (
  SELECT m.star, m.id, coalesce(i.items, 0) AS items, coalesce(i.done, 0) AS done,
         length(m.criteria) - length(replace(m.criteria, '@', '')) AS conditions
  FROM milestones m LEFT JOIN items i ON i.star = m.star AND i.id = m.id
  WHERE coalesce(m.criteria, '') <> ''
)
SELECT (SELECT count(*) FROM milestones) AS milestones, (SELECT count(DISTINCT star) FROM milestones) AS stars,
       count(*) FILTER (WHERE items > 0 AND done = items AND conditions = 0) AS reached,
       count(*) FILTER (WHERE conditions > 0) AS by_tests FROM each
"""
line = "{milestones} milestones in {stars} stars: {reached} reached - every item they rest on is done; {by_tests} rest on what tests tell, not judged here"
