# The lens of purpose.
[lens]
id = "purpose"
says = "Why a star exists and what it must reach: its idea, and its milestones with what makes each reached."

[tables.idea]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "ord", type = "integer", required = true },
    { name = "kind", type = "string", required = true, enum = ["lead", "problem", "idea", "picture", "limit", "start"] },
    { name = "heading", type = "string" },
    { name = "text", type = "string", required = true },
]

[tables.milestones]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "subject", type = "string", required = true },
    { name = "ord", type = "integer", required = true },
    { name = "title", type = "string", required = true },
    { name = "horizon", type = "string", required = true, enum = ["working", "perfection", "ongoing"] },
    { name = "readiness", type = "integer", required = true },
    { name = "criteria", type = "string" },
    { name = "why", type = "string" },
]

# a milestone is reached when these are done: links to rows (backlog:id), and conditions - something
# at a device or a level, always written with an @ (feature:voice-calls@linux-best,
# component:kernel@xiaomi-surya, tests@xiaomi-surya) - which are not links to a row and are passed over
[[relation]]
from = "milestones.criteria"
to = ["*"]
passes_over = ["@"]

# The glimpse of the lens of purpose.
[[glimpse]]
entry = "milestone"
says = "What must be reached, and what makes it reached."
table = "milestones"
asks = ["title", "subject", "horizon", "readiness", "ord", "criteria", "why"]

[[glimpse]]
entry = "idea"
says = "Why the star exists: one part of its idea."
table = "idea"
asks = ["kind", "heading", "text", "ord"]

# The focus of the lens of purpose: what each star is for, and what is being reached.
[[focus]]
title = "what each star is for ({count})"
sql = """
SELECT star, CASE WHEN length("text") > 190 THEN left("text", 190) || '...' ELSE "text" END AS says
FROM idea WHERE kind = 'lead' ORDER BY star, seq
"""
line = "{star} - {says}"

[[focus]]
title = "being reached, the nearest first ({count})"
sql = """
SELECT star, title, try_cast(readiness AS INTEGER) AS readiness FROM milestones
WHERE horizon = 'working' AND try_cast(readiness AS INTEGER) < 9
ORDER BY 3 DESC, star, seq LIMIT 20
"""
line = "{star} - {title}: {readiness} of 9"

[[focus]]
always = true
sql = """
SELECT count(*) AS milestones, count(DISTINCT star) AS stars,
       count(*) FILTER (WHERE horizon = 'working') AS working,
       count(*) FILTER (WHERE horizon = 'perfection') AS perfection,
       count(*) FILTER (WHERE horizon = 'ongoing') AS ongoing,
       count(*) FILTER (WHERE try_cast(readiness AS INTEGER) = 9) AS full FROM milestones
"""
line = "{milestones} milestones in {stars} stars: {working} toward working, {perfection} toward perfection, {ongoing} ongoing; {full} at 9 of 9"
