# The lens of work.
[lens]
id = "work"
says = "The flow of work: what is in progress and by whom - read off what was done - what is next, what waits and on what, what was finished."
reads = ["glimpses", "edges", "problems"]

# The backlog is also the board's flow (the board is a view over it, never a list of its own):
# open -> next -> in-progress -> waiting / parked -> done or dropped. In progress, an item has a driver
# (who holds it), a next step, and since (the day it entered its state); waiting says on what.
[tables.backlog]
key = ["id"]
extra_fields = true
dated = "opened"
fields = [
    { name = "id", type = "string", required = true },
    { name = "title", type = "string", required = true },
    { name = "status", type = "string", required = true, enum = ["open", "next", "in-progress", "waiting", "parked", "done", "dropped"] },
    { name = "note", type = "string" },
    { name = "opened", type = "string" },
    { name = "driver", type = "string" },
    { name = "next", type = "string" },
    { name = "since", type = "string" },
    { name = "waits_on", type = "string" },
    { name = "serves", type = "string" },
]

# why this work: the milestone or decision it serves
[[relation]]
from = "backlog.serves"
to = ["milestones", "decisions"]

# The glimpse of the lens of work: what can be entered through it. A person is asked only for what
# the computer cannot know; the rest is supplied - and what a person does give always stands.
[[glimpse]]
entry = "item"
says = "A piece of work: opened, or moved along the flow."
table = "backlog"
asks = ["title", "status", "next", "waits_on", "serves", "note"]
supplies = [
    { field = "since", from = "today", when = "status changes" },
    { field = "driver", from = "who", when = "status becomes in-progress" },
]

# The focus of the lens of work: the flow as Kanban asks it to be seen, and what needs attention.
# Each part is a query over the gathered rows (every row with its star, and seq - its place in the
# order gathered) and a line laying out one answer; {today} is supplied by the computer.
# What is being worked on is not a state to set: it is read off the work. Every record of work says
# What is being worked on is not a state to set: it is read off the work. Every record of work says
# which item it advances. An item worked on within the last day and not said to be done is in progress
# - by whom, how often, when last; one said to be done and worked on in the last days is finished
# lately. Nobody types either, so neither drifts. One question, laid out once for each of the two; an
# item touched some days ago and not since is neither - it is as it was said to be.
[[focus]]
title = "{state} ({count})"
sql = """
WITH done AS (
  SELECT e.to_star AS star, e.to_id AS id, CAST(g."at" AS VARCHAR) AS at_, lower(g."by") AS who
  FROM edges e JOIN glimpses g ON g.star = e.from_star AND g.id = e.from_id
  WHERE e.how = 'advances' AND e.from_table = 'glimpses' AND e.to_table = 'backlog'
    AND try_cast(left(CAST(g."at" AS VARCHAR), 10) AS DATE) >= DATE '{today}' - INTERVAL 2 DAY
), each AS (
  SELECT CASE WHEN b.status = 'done' THEN 'finished lately' ELSE 'in progress - read off what was done' END AS state,
         string_agg(DISTINCT d.who, ', ' ORDER BY d.who) AS who, b.star, b.id, b.title,
         CASE WHEN b.status <> 'done' AND coalesce(b.next, '') <> '' THEN ' - next: ' || b.next ELSE '' END AS next,
         count(*) AS times, max(left(d.at_, 16)) AS last, max(d.at_) AS last_at
  FROM done d JOIN backlog b ON b.star = d.star AND b.id = d.id
  WHERE b.status NOT IN ('dropped', 'parked')
  GROUP BY b.star, b.id, b.title, b.next, b.status
  HAVING b.status = 'done' OR max(try_cast(d.at_ AS TIMESTAMPTZ)) >= now() - INTERVAL 24 HOUR
)
SELECT state, who, star, id, title, next, times, replace(last, 'T', ' ') AS last FROM each
QUALIFY row_number() OVER (PARTITION BY state ORDER BY last_at DESC) <= 12
ORDER BY state DESC, last_at DESC, star, id
"""
line = "{who}: {star}/{id} - {title}{next} ({times} time(s), the last at {last})"
per = "state"

[[focus]]
title = "said to be in progress, though nothing done lately advances it ({count})"
sql = """
SELECT b.star, b.id, b.title FROM backlog b
WHERE b.status = 'in-progress' AND NOT EXISTS (
  SELECT 1 FROM edges e JOIN glimpses g ON g.star = e.from_star AND g.id = e.from_id
  WHERE e.how = 'advances' AND e.from_table = 'glimpses' AND e.to_table = 'backlog' AND e.to_star = b.star AND e.to_id = b.id
    AND try_cast(left(CAST(g."at" AS VARCHAR), 10) AS DATE) >= DATE '{today}' - INTERVAL 3 DAY)
ORDER BY b.seq
"""
line = "{star}/{id} - {title}"

[[focus]]
title = "waiting ({count})"
sql = """
SELECT star, id, title, coalesce(nullif(waits_on, ''), 'nothing said') AS waits_on
FROM backlog WHERE status = 'waiting' ORDER BY seq
"""
line = "{star}/{id} - {title} - waits on {waits_on}"

# What holds an item back is read off what halts it: a connection says this halted that, and it holds while
# what halts is not done - an item not done or dropped, a sign nothing has come of - unless a connection
# says the halt ended. One shape, named, that the two parts below ask of.
[[focus]]
named = "holding"
sql = """
SELECT h.to_star AS star, h.to_id AS id,
       h.from_star || '/' || h.from_table || ':' || h.from_id AS halter,
       h.from_star AS halter_star, h.from_table AS halter_table, h.from_id AS halter_id,
       CASE WHEN h.from_table = 'backlog' THEN coalesce(hb.status, 'not found')
            WHEN h.from_table = 'problems' THEN 'a sign nothing has come of yet'
            ELSE 'a ' || h.from_table || ' row' END AS stands
FROM edges h
LEFT JOIN backlog hb ON h.from_table = 'backlog' AND hb.star = h.from_star AND hb.id = h.from_id
LEFT JOIN problems hp ON h.from_table = 'problems' AND hp.star = h.from_star AND hp.id = h.from_id
WHERE h.how = 'halted' AND h.to_table = 'backlog' AND h.holds
  AND coalesce(hb.status, '') NOT IN ('done', 'dropped')
  AND NOT (h.from_table = 'problems' AND (coalesce(hp.handled, '') <> '' OR EXISTS (
        SELECT 1 FROM edges l WHERE l.how = 'led to' AND l.from_table = 'problems' AND l.from_star = h.from_star AND l.from_id = h.from_id)))
  AND NOT EXISTS (SELECT 1 FROM edges x WHERE x.how = 'ended' AND x.to_table = 'connections' AND x.to_star = h.via_star AND x.to_id = h.via_id)
"""

[[focus]]
title = "held back - read off what halts it ({count})"
sql = """
SELECT b.star, b.id, b.title, string_agg(h.halter || ' (' || h.stands || ')', ', ' ORDER BY h.halter) AS by
FROM holding h JOIN backlog b ON b.star = h.star AND b.id = h.id
WHERE b.status NOT IN ('done', 'dropped') GROUP BY b.star, b.id, b.title, b.seq ORDER BY b.star, b.seq
"""
line = "{star}/{id} - {title} - held back by {by}"

[[focus]]
title = "said to be waiting, though nothing drawn holds it back ({count})"
sql = """
SELECT b.star, b.id, b.title, coalesce(nullif(b.waits_on, ''), 'nothing said') AS waits_on FROM backlog b
WHERE b.status = 'waiting' AND NOT EXISTS (SELECT 1 FROM holding h WHERE h.star = b.star AND h.id = b.id)
ORDER BY b.star, b.seq
"""
line = "{star}/{id} - {title} - waits on, in words: {waits_on}"

[[focus]]
title = "next ({count})"
sql = "SELECT star, id, title FROM backlog WHERE status = 'next' ORDER BY seq"
line = "{star}/{id} - {title}"

# a driver holding more than three at once; work in progress held by nobody or with no next step;
# work that has not moved for more than a week
[[focus]]
title = "needs attention ({count})"
sql = """
SELECT text FROM (
  SELECT 1 AS g, driver AS o, 0 AS s, 0 AS k, driver || ' holds ' || count(*) || ' at once (more than 3)' AS text
    FROM backlog WHERE status = 'in-progress' AND coalesce(driver, '') <> '' GROUP BY driver HAVING count(*) > 3
  UNION ALL
  SELECT 2, '', seq, 1, star || '/' || id || ' is in progress, held by nobody'
    FROM backlog WHERE status = 'in-progress' AND coalesce(driver, '') = ''
  UNION ALL
  SELECT 2, '', seq, 2, star || '/' || id || ' is in progress with no next step'
    FROM backlog WHERE status = 'in-progress' AND coalesce(next, '') = ''
) ORDER BY g, o, s, k
"""
line = "{text}"

# What has not moved is a sign, and the lens of signs says what that is: its part is placed here.
# One lens asks; this one only places - the same line of a query is not written twice.
[[focus]]
through = "signs"
only = "not moved in the work"

[[focus]]
always = true
sql = """
SELECT count(*) FILTER (WHERE status = 'open') AS open, count(*) FILTER (WHERE status = 'parked') AS parked,
       count(DISTINCT star) AS stars FROM backlog
"""
line = "open {open} and parked {parked}, across {stars} stars"

# how much of the work says what it is for: reading off the act is only as true as this
[[focus]]
always = true
sql = """
SELECT count(*) AS records, count(*) FILTER (WHERE coalesce(advances, '') <> '') AS tied
FROM glimpses WHERE try_cast(left(CAST("at" AS VARCHAR), 10) AS DATE) >= DATE '{today}' - INTERVAL 2 DAY
"""
line = "of {records} records of work in three days, {tied} say what they advance"
