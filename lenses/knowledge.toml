# The lens of knowledge.
[lens]
id = "knowledge"
says = "What is known and where it comes from: questions and what was found, sources, concepts, and the words with their meanings."

[tables.research]
key = ["id"]
extra_fields = true
dated = "date"
fields = [
    { name = "id", type = "string", required = true },
    { name = "question", type = "string", required = true },
    { name = "found", type = "string", required = true },
    { name = "sources", type = "string" },
    { name = "date", type = "string" },
]

[tables.sources]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "title", type = "string", required = true },
    { name = "by", type = "string" },
    { name = "year", type = "integer" },
    { name = "url", type = "string" },
    { name = "takes", type = "string", required = true },
]

[tables.concepts]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "name", type = "string", required = true },
    { name = "summary", type = "string", required = true },
    { name = "why", type = "string" },
]

[tables.vocabulary]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true },
    { name = "term", type = "string", required = true },
    { name = "means", type = "string", required = true },
    { name = "not", type = "string" },
    { name = "see", type = "string" },
    { name = "decided", type = "string" },
]

[[relation]]
from = "research.sources"
to = ["sources"]

[[relation]]
from = "vocabulary.decided"
to = ["decisions"]

# The glimpse of the lens of knowledge.
[[glimpse]]
entry = "research"
says = "A question looked into, and what was found."
table = "research"
asks = ["question", "found", "sources"]
supplies = [{ field = "date", from = "today", when = "new" }]

[[glimpse]]
entry = "source"
says = "Where something known comes from, and what is taken from it."
table = "sources"
asks = ["title", "by", "year", "url", "takes"]

[[glimpse]]
entry = "concept"
says = "An idea the work stands on."
table = "concepts"
asks = ["name", "summary", "why"]

[[glimpse]]
entry = "word"
says = "A word and its one meaning: what it means, what it is not, and the decision that chose it."
table = "vocabulary"
asks = ["term", "means", "not", "see", "decided"]

# The focus of the lens of knowledge: what was looked into lately, and the words and what they mean.
[[focus]]
title = "looked into lately ({count})"
sql = """
SELECT star, question, left(CAST("date" AS VARCHAR), 10) AS day FROM research
WHERE try_cast("date" AS DATE) >= DATE '{today}' - INTERVAL 7 DAY
ORDER BY "date" DESC, seq DESC LIMIT 12
"""
line = "{day} {star} - {question}"

[[focus]]
title = "the words, and what they mean ({count})"
sql = """
SELECT term, CASE WHEN length(means) > 170 THEN left(means, 170) || '...' ELSE means END AS means
FROM vocabulary ORDER BY lower(term), seq
"""
line = "{term} - {means}"

[[focus]]
always = true
sql = """
SELECT (SELECT count(*) FROM research) AS questions, (SELECT count(*) FROM sources) AS sources,
       (SELECT count(*) FROM concepts) AS concepts, (SELECT count(*) FROM vocabulary) AS words
"""
line = "{questions} questions looked into, {sources} sources, {concepts} concepts, {words} words"
