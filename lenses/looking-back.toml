# The lens of looking-back.
[lens]
id = "looking-back"
says = "Looking back over the work: reflections, and the log of sessions."

# A reflection: someone - a person or a machine - looks back over a stretch of work and says what they
# saw, what they learned, and what changes because of it (after the After Action Review's questions).
# It touches what it is about - decisions, practices, backlog, research, glimpses - as table:id in this
# project or project/table:id in another, and may answer another reflection.
[tables.reflections]
key = ["id"]
extra_fields = true
fields = [
    { name = "id", type = "string", required = true, pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$" },
    { name = "date", type = "date", required = true },
    { name = "by", type = "string", required = true },
    { name = "over", type = "string", required = true },
    { name = "saw", type = "string", required = true },
    { name = "learned", type = "string", required = true },
    { name = "changes", type = "string" },
    { name = "answers", type = "string" },
    { name = "touches", type = "string" },
]

[tables.session_log]
key = ["id"]
extra_fields = true
dated = "entry_date"
fields = [
    { name = "id", type = "string", required = true },
    { name = "entry_date", type = "string", required = true },
    { name = "title", type = "string", required = true },
    { name = "done", type = "string", required = true },
    { name = "considered", type = "string" },
    { name = "rejected", type = "string" },
]

[[relation]]
from = "reflections.touches"
to = ["*"]

[[relation]]
from = "reflections.answers"
to = ["reflections"]

# The glimpse of the lens of looking back.
[[glimpse]]
entry = "reflection"
says = "Looking back: what was seen, what was learned, and what it changes."
table = "reflections"
asks = ["over", "saw", "learned", "changes", "answers", "touches"]
supplies = [{ field = "date", from = "today", when = "new" }, { field = "by", from = "who", when = "new" }]

[[glimpse]]
entry = "session"
says = "A session of work: what was done, considered and rejected."
table = "session_log"
asks = ["title", "done", "considered", "rejected"]
supplies = [{ field = "entry_date", from = "today", when = "new" }]

# The focus of the lens of looking back: the latest reflections and sessions.
[[focus]]
title = "reflections, the newest ({count})"
sql = """
SELECT left(CAST("date" AS VARCHAR), 10) AS day, "by" AS who, "over" AS about,
       CASE WHEN length(learned) > 200 THEN left(learned, 200) || '...' ELSE learned END AS learned
FROM reflections ORDER BY "date" DESC, seq DESC LIMIT 8
"""
line = "{day} {who}, over {about}: {learned}"

[[focus]]
title = "sessions, the newest ({count})"
sql = """
SELECT star, left(CAST(entry_date AS VARCHAR), 10) AS day, title FROM session_log ORDER BY entry_date DESC, seq DESC LIMIT 10
"""
line = "{day} {star} - {title}"

[[focus]]
always = true
sql = """
SELECT (SELECT count(*) FROM reflections) AS reflections, (SELECT count(*) FROM session_log) AS sessions,
       (SELECT count(DISTINCT star) FROM session_log) AS stars
"""
line = "{reflections} reflections; {sessions} sessions in {stars} stars"
