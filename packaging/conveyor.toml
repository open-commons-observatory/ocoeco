# How ocoeco is delivered: read by the package conveyor (linux-package-distribution-oco/conveyor).
# Binaries for every release tag ocoeco-v*; ocoeco's build and pack scripts stay here.

[package]
name = "ocoeco"
tag-prefix = "ocoeco-v"
fingerprint = "none - ocoeco publishes no package repository yet"
key = "none"

[binaries]
build = "packaging/build-binary.sh"
package = "packaging/build-packages.sh"
